  - changeSet:
      id: 007-seed-main-warehouse
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM warehouses WHERE code = 'PLANTA'
      changes:
        - insert:
            tableName: warehouses
            columns:
              - column:
                  name: code
                  value: PLANTA
              - column:
