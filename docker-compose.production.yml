name: oxipur

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0-bookworm
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: oxipur_inventory
      MYSQL_USER: oxipur_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: America/La_Paz
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=384M
      - --max-connections=50
      - --performance-schema=OFF
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/oxipur_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz
      MYSQL_USER: oxipur_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0 -Duser.timezone=America/La_Paz
      TZ: America/La_Paz
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    networks:
      - app_internal
    expose:
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - edge
      - app_internal
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  mysql_data:
  backend_storage:
  caddy_data:
  caddy_config:

networks:
  edge:
  app_internal:
    internal: true
